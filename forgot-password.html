<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Reset Password — ChoreMatrix</title>
<meta name="description" content="Request a password reset link for your ChoreMatrix account." />
<link rel="canonical" href="https://chorematrix.com/forgot-password.html" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="alternate icon" href="/favicon.ico" />
<meta property="og:title" content="Reset Password — ChoreMatrix" />
<meta property="og:description" content="Request a password reset link for your ChoreMatrix account." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://chorematrix.com/forgot-password.html" />
<meta property="og:image" content="https://chorematrix.com/og-image.jpg" />
<meta property="og:site_name" content="ChoreMatrix" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Reset Password — ChoreMatrix" />
<meta name="twitter:description" content="Request a password reset link for your ChoreMatrix account." />
<meta name="twitter:image" content="https://chorematrix.com/og-image.jpg" />
<script>
  (function() {
    try {
      var s = localStorage.getItem('chorematrix_theme') || 'system';
      var d = s === 'dark' || (s === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme-setting', s);
    } catch(e){}
  })();
</script>
<link rel="stylesheet" href="/src/styles/common.css" />
<style>
  .auth-wrap {
    max-width: 440px;
    margin: 40px auto;
    width: 100%;
  }
  .auth-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px;
    box-shadow: var(--shadow);
  }
</style>
</head>
<body>

<div id="globalNavbar"></div>

<main class="main-content">
  <div class="shell">
    <div class="auth-wrap">
      <div class="auth-card">
        <h1 style="font-size:24px; font-weight:800; margin:0 0 6px; color:var(--ink); text-align:center;">Reset Password</h1>
        <p style="font-size:13px; color:var(--muted); text-align:center; margin:0 0 24px;">
          Enter your account email and we’ll send you a recovery link.
        </p>

        <div id="resetAlert" class="alert-box" style="display:none;" role="alert"></div>
        <div id="resetSuccess" class="notice-banner" style="display:none;"></div>

        <form id="forgotForm">
          <div class="field">
            <label for="txtResetEmail">Email Address</label>
            <input type="email" id="txtResetEmail" required placeholder="you@example.com" />
          </div>

          <button type="submit" class="btn primary" id="btnSubmitReset" style="width:100%; margin-top:8px;">
            Send Reset Link
          </button>
        </form>

        <div style="text-align:center; font-size:13px; color:var(--muted); margin-top:20px;">
          Remembered your password? <a href="/login.html" style="font-weight:700;">Sign in</a>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="globalFooter"></div>

<script type="module">
import { authService, renderNavbar, renderFooter, initCookieBanner } from './src/client.bundle.js';

renderNavbar('forgot-password');
renderFooter();
initCookieBanner();

const form = document.getElementById('forgotForm');
const emailInput = document.getElementById('txtResetEmail');
const submitBtn = document.getElementById('btnSubmitReset');
const alertBox = document.getElementById('resetAlert');
const successBox = document.getElementById('resetSuccess');

form?.addEventListener('submit', async (e) => {
  e.preventDefault();
  alertBox.style.display = 'none';
  successBox.style.display = 'none';

  const email = emailInput.value.trim();
  if (!email || !email.includes('@')) {
    alertBox.textContent = 'Please enter a valid email address.';
    alertBox.style.display = 'block';
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Sending link…';

  try {
    await authService.requestPasswordReset(email);
    successBox.innerHTML = `
      <strong>Email Dispatched:</strong> If an account exists for <em>${escapeHtml(email)}</em>, a password reset link has been sent. Please check your inbox and spam folder.
    `;
    successBox.style.display = 'block';
    form.style.display = 'none';
  } catch (err) {
    alertBox.textContent = err.message || 'Unable to request password reset. Please try again later.';
    alertBox.style.display = 'block';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Send Reset Link';
  }
});

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
</script>
</body>
</html>
