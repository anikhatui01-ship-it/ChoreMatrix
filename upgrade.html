<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Upgrade Plan — ChoreMatrix Household Workload Optimizer</title>
<meta name="description" content="Upgrade your ChoreMatrix plan for an ad-free workspace, 4-week multi-week rotation, and cloud synchronization." />
<link rel="canonical" href="https://chorematrix.com/upgrade.html" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="alternate icon" href="/favicon.ico" />
<meta property="og:title" content="Upgrade Plan — ChoreMatrix Household Workload Optimizer" />
<meta property="og:description" content="Upgrade your ChoreMatrix plan for an ad-free workspace, 4-week multi-week rotation, and cloud synchronization." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://chorematrix.com/upgrade.html" />
<meta property="og:image" content="https://chorematrix.com/og-image.jpg" />
<meta property="og:site_name" content="ChoreMatrix" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Upgrade Plan — ChoreMatrix Household Workload Optimizer" />
<meta name="twitter:description" content="Upgrade your ChoreMatrix plan for an ad-free workspace, 4-week multi-week rotation, and cloud synchronization." />
<meta name="twitter:image" content="https://chorematrix.com/og-image.jpg" />
<script>
  (function() {
    try {
      var s = localStorage.getItem('chorematrix_theme') || 'system';
      var d = s === 'dark' || (s === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme-setting', s);
    } catch(e){}
  })();
</script>
<link rel="stylesheet" href="/src/styles/common.css" />
<script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
<style>
  .upgrade-wrap {
    max-width: 680px;
    margin: 36px auto;
  }
  .upgrade-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px;
    box-shadow: var(--shadow);
  }
  .feature-list {
    list-style: none;
    padding: 0;
    margin: 18px 0;
    display: grid;
    gap: 10px;
  }
  .feature-list li {
    font-size: 13px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .feature-list li::before {
    content: "✓";
    color: var(--primary);
    font-weight: 800;
  }
  .checkout-feedback {
    display: none;
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 13px;
    line-height: 1.4;
  }
  .checkout-feedback.error {
    display: block;
    background: #fef2f2;
    border: 1px solid #f87171;
    color: #991b1b;
  }
  .checkout-feedback.info {
    display: block;
    background: #f0fdf4;
    border: 1px solid #4ade80;
    color: #166534;
  }
</style>
</head>
<body>

<div id="globalNavbar"></div>

<main class="main-content">
  <div class="shell">
    <div class="upgrade-wrap">
      <div style="text-align: center; margin-bottom: 24px;">
        <span class="badge" style="background: var(--badge-amber-bg); color: var(--badge-amber-text); margin-bottom: 8px;">
          Cashfree Sandbox Subscriptions
        </span>
        <h1 style="font-size: 28px; font-weight: 800; margin: 0 0 6px; color: var(--ink);">
          Upgrade Your ChoreMatrix Plan
        </h1>
        <p style="font-size: 14px; color: var(--muted); margin: 0;">
          Unlock 100% ad-free planning, multi-week rotation, and continuous household synchronization.
        </p>
      </div>

      <div id="fallbackNotice" class="notice-banner" style="display: none; margin-bottom: 16px;"></div>
      <div id="checkoutFeedback" class="checkout-feedback"></div>

      <div class="upgrade-card" id="upgradeCardContent">
        <!-- Populated dynamically from centralized PRICING_CONFIG -->
        <div style="text-align: center; padding: 24px; color: var(--muted);">Loading plan details…</div>
      </div>
    </div>
  </div>
</main>

<div id="globalFooter"></div>

<script type="module">
import {
  PRICING_CONFIG,
  getTierById,
  getDefaultPaidTier,
  getCashfreePlanId,
  initiateCashfreeSubscription,
  COUNTRIES,
  DEFAULT_COUNTRY,
  normalizePhoneNumber,
  persistenceAdapter,
  authService,
  renderNavbar,
  renderFooter,
  initCookieBanner
} from './src/client.bundle.js';

renderNavbar('pricing');
renderFooter();
initCookieBanner();

const params = new URLSearchParams(window.location.search);
const requestedPlanId = params.get('plan');
const requestedInterval = params.get('interval') || 'monthly';
const isAnnual = requestedInterval === 'annual' || requestedInterval === 'annually';

let selectedTier = getTierById(requestedPlanId);
const fallbackNoticeEl = document.getElementById('fallbackNotice');
const feedbackEl = document.getElementById('checkoutFeedback');

if (!selectedTier || selectedPlanIsFree(selectedTier)) {
  if (requestedPlanId && requestedPlanId !== 'free') {
    if (fallbackNoticeEl) {
      fallbackNoticeEl.textContent = `Notice: Plan "${escapeHtml(requestedPlanId)}" was not recognized. Displaying Pro details below.`;
      fallbackNoticeEl.style.display = 'block';
    }
  }
  selectedTier = getDefaultPaidTier();
}

function selectedPlanIsFree(tier) {
  return tier.monthlyPrice === 0;
}

async function renderUpgradeCard() {
  const cardEl = document.getElementById('upgradeCardContent');
  if (!cardEl || !selectedTier) return;

  // Check user authentication and server-side trial consumption status
  let user = null;
  let userProfile = null;
  try {
    user = await authService.getUser();
    if (user) {
      userProfile = await persistenceAdapter.getProfile(user.id);
    }
  } catch (err) {
    console.warn('[Upgrade Page] Profile status check error:', err);
  }

  const isTrialConsumed = Boolean(userProfile?.trial_consumed);
  const isTrialEligible = !isTrialConsumed && selectedTier.trialDays > 0;

  const displayPrice = isAnnual ? selectedTier.annualPrice : selectedTier.monthlyPrice;
  const intervalUnit = isAnnual ? '/ yr' : '/ mo';
  const subIntervalText = isAnnual
    ? `Billed annually (${escapeHtml(selectedTier.annualSavingText)})`
    : `or $${selectedTier.annualPrice.toFixed(2)}/yr billed annually (${escapeHtml(selectedTier.annualSavingText)})`;
  const renewalText = isAnnual
    ? `$${selectedTier.checkoutDisclosures.chargedAfterTrialAnnual.toFixed(2)}/yr`
    : `$${selectedTier.checkoutDisclosures.chargedAfterTrialMonthly.toFixed(2)}/mo`;

  const cashfreePlanId = getCashfreePlanId(selectedTier.id, isAnnual ? 'annually' : 'monthly') || 'CHOREMATRIX_PRO_MONTHLY';

  cardEl.innerHTML = `
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 16px; flex-wrap: wrap;">
      <div>
        <h2 style="font-size: 22px; font-weight: 800; margin: 0 0 4px; color: var(--ink);">
          ${escapeHtml(selectedTier.name)}
        </h2>
        <div style="font-size: 13px; color: var(--muted);">${escapeHtml(selectedTier.tagline)}</div>
      </div>
      <div style="text-align: right;">
        <div style="font-size: 28px; font-weight: 800; color: var(--ink);">
          $${displayPrice.toFixed(2)}
          <small style="font-size: 13px; color: var(--muted); font-weight: 600;">${intervalUnit}</small>
        </div>
        <div style="font-size: 11px; color: var(--muted);">${subIntervalText}</div>
      </div>
    </div>

    ${isTrialEligible ? `
      <div style="margin-bottom: 16px;">
        <span class="badge" style="background: var(--badge-teal-bg); color: var(--badge-teal-text);">
          ⭐ Includes ${selectedTier.trialDays}-Day Introductory Trial
        </span>
      </div>
    ` : (isTrialConsumed ? `
      <div style="margin-bottom: 16px;">
        <span class="badge" style="background: var(--panel-subtle); color: var(--muted); border: 1px solid var(--line);">
          Standard Subscription (Introductory trial already used for this account)
        </span>
      </div>
    ` : '')}

    <div style="font-size: 13px; font-weight: 700; color: var(--ink); margin-top: 16px;">What's Included:</div>
    <ul class="feature-list">
      ${selectedTier.features.map(f => `<li>${escapeHtml(f)}</li>`).join('')}
    </ul>

    <!-- Transparent Continuous Service & Mandate Authorization Terms -->
    <div style="background: var(--panel-subtle); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin: 20px 0; font-size: 12px; color: var(--muted); line-height: 1.45;">
      <strong style="color: var(--ink);">Continuous Service & Renewal Terms:</strong><br>
      • Payment Method Authorization Today: USD $1.00 mandate verification hold (deducted by Cashfree to authorize payment method).<br>
      • Recurring Subscription: ${renewalText} billed automatically starting on your first scheduled billing date (${isTrialEligible ? 'after 7-day trial' : 'on standard cycle'}) until cancelled.<br>
      • Online Cancellation: Cancel online anytime via Account Settings prior to scheduled billing to prevent future charges.<br>
      • Trial Eligibility: Introductory 7-day trial is strictly one-time per ChoreMatrix account. Subsequent subscriptions renew immediately.
    </div>

    <div style="background: var(--badge-amber-bg); border: 1px solid var(--warn); border-radius: 8px; padding: 14px; margin-bottom: 20px; font-size: 12px; color: var(--ink); line-height: 1.45;">
      <strong>Upgrade Checkout Coming Soon:</strong><br>
      Payment processing is currently being finalized for production. Live credit card checkout and subscription activation will open soon. Cashfree SANDBOX subscription checkout is active below for testing.
    </div>

    <!-- Country calling-code selector + national mobile number input -->
    <div style="margin-bottom: 20px; text-align: left;">
      <label style="display: block; font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 6px;">
        Mobile number
      </label>
      <div style="display: flex; gap: 8px; align-items: stretch;">
        <div style="flex: 0 0 150px;">
          <label for="selCountryCode" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0;">Country</label>
          <select
            id="selCountryCode"
            aria-label="Country Calling Code"
            style="width: 100%; height: 100%; padding: 11px 8px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; background: var(--panel); color: var(--ink); box-sizing: border-box; cursor: pointer;"
          >
            ${(COUNTRIES || []).map(c => `
              <option value="${c.code}" ${c.code === 'IN' ? 'selected' : ''}>
                ${escapeHtml(c.name)} (${c.dialCode})
              </option>
            `).join('')}
          </select>
        </div>
        <div style="flex: 1;">
          <label for="txtCustomerPhone" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0;">National Mobile Number</label>
          <input
            id="txtCustomerPhone"
            type="tel"
            inputmode="numeric"
            autocomplete="tel"
            placeholder="e.g. ${DEFAULT_COUNTRY?.placeholder || '7001240613'}"
            style="width: 100%; padding: 11px 14px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; background: var(--panel); color: var(--ink); box-sizing: border-box;"
          />
        </div>
      </div>
      <div style="font-size: 11px; color: var(--muted); margin-top: 5px;">
        Enter your national number only. Calling code is added automatically for Cashfree mandate notifications (10–15 total digits).
      </div>
    </div>

    <div style="margin-bottom: 20px;">
      <button type="button" id="btnCashfreeUpgrade" class="btn primary" style="width: 100%; font-size: 15px; font-weight: 700; padding: 12px 18px; text-align: center;">
        Upgrade to ${escapeHtml(selectedTier.name)} with Cashfree (Sandbox)
      </button>
      <div id="inlineCheckoutError" style="display: none; margin-top: 12px; padding: 12px 14px; background: #fef2f2; border: 1px solid #ef4444; border-radius: 8px; color: #991b1b; font-size: 13px; font-weight: 600; line-height: 1.45; text-align: left; word-break: break-word;"></div>
      <div style="font-size: 11px; color: var(--muted); text-align: center; margin-top: 6px;">
        Cashfree Sandbox Plan: <code>${escapeHtml(cashfreePlanId)}</code> · Return Domain: <code>https://chorematrix.online</code>
      </div>
    </div>

    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
      <a href="/app.html" class="btn" style="flex: 1; text-align: center;">
        Continue with Free Optimizer
      </a>
      <a href="/pricing.html" class="btn" style="flex: 1; text-align: center;">
        Compare All Plans
      </a>
    </div>
  `;

  // Attach dynamic placeholder updates when country changes
  const countrySelect = document.getElementById('selCountryCode');
  const phoneInput = document.getElementById('txtCustomerPhone');
  if (countrySelect && phoneInput) {
    countrySelect.addEventListener('change', () => {
      const selected = (COUNTRIES || []).find(c => c.code === countrySelect.value) || DEFAULT_COUNTRY;
      phoneInput.placeholder = `e.g. ${selected.placeholder}`;
    });
  }

  // Attach Cashfree upgrade trigger
  const upgradeBtn = document.getElementById('btnCashfreeUpgrade');
  const inlineErrorEl = document.getElementById('inlineCheckoutError');

  function displayCheckoutError(msg) {
    console.error('[Upgrade Checkout Error Surfaced]:', msg);
    if (inlineErrorEl) {
      inlineErrorEl.textContent = `Checkout Error: ${msg}`;
      inlineErrorEl.style.display = 'block';
    }
    showFeedback(msg, 'error');
  }

  function clearAllErrors() {
    if (inlineErrorEl) {
      inlineErrorEl.style.display = 'none';
      inlineErrorEl.textContent = '';
    }
    clearFeedback();
  }

  if (upgradeBtn) {
    upgradeBtn.addEventListener('click', async () => {
      clearAllErrors();

      // 1. Verify user is authenticated with a valid session
      const currentUser = await authService.getUser();
      const currentPlan = selectedTier?.id || 'pro';
      const currentInterval = isAnnual ? 'annual' : 'monthly';
      const returnUrl = `/upgrade.html?plan=${encodeURIComponent(currentPlan)}&interval=${encodeURIComponent(currentInterval)}`;

      if (!currentUser) {
        displayCheckoutError('Please sign in or create an account to upgrade your subscription plan. Redirecting to sign in…');
        setTimeout(() => {
          window.location.href = `/login.html?redirect=${encodeURIComponent(returnUrl)}`;
        }, 1200);
        return;
      }

      // 2. Validate clean 10–15 digit mobile number and normalize with country code
      const countryCode = countrySelect ? countrySelect.value : 'IN';
      const rawPhone = phoneInput ? phoneInput.value : '';
      const cleanPhone = rawPhone.replace(/\D/g, '');
      const normResult = normalizePhoneNumber(countryCode, rawPhone);

      if (!normResult.isValid) {
        displayCheckoutError(normResult.error || 'Please enter a valid mobile number (10 to 15 digits) before proceeding to checkout.');
        if (phoneInput) phoneInput.focus();
        return;
      }

      // 3. Set button loading state
      const originalText = upgradeBtn.textContent;
      upgradeBtn.disabled = true;
      upgradeBtn.textContent = 'Connecting to Cashfree Sandbox…';

      try {
        console.log('[Upgrade Page] Initiating subscription upgrade for:', selectedTier.id, isAnnual ? 'annual' : 'monthly', 'phone:', normResult.e164);
        const result = await initiateCashfreeSubscription({
          plan: selectedTier.id,
          interval: isAnnual ? 'annual' : 'monthly',
          phone: normResult.e164
        });

        if (!result.success) {
          displayCheckoutError(result.error || 'Unable to initiate Cashfree checkout session.');
          upgradeBtn.disabled = false;
          upgradeBtn.textContent = originalText;
        } else {
          showFeedback('Cashfree checkout session initialized. Redirecting to payment authorization…', 'info');
          upgradeBtn.textContent = 'Redirecting to Cashfree…';
        }
      } catch (err) {
        console.error('[Upgrade Checkout Exception]', err);
        displayCheckoutError(err.message || 'An unexpected error occurred while launching Cashfree checkout.');
        upgradeBtn.disabled = false;
        upgradeBtn.textContent = originalText;
      }
    });
  }
}

renderUpgradeCard();

function showFeedback(msg, type = 'error') {
  if (!feedbackEl) return;
  feedbackEl.textContent = msg;
  feedbackEl.className = `checkout-feedback ${type}`;
  window.scrollTo({ top: feedbackEl.offsetTop - 40, behavior: 'smooth' });
}

function clearFeedback() {
  if (!feedbackEl) return;
  feedbackEl.style.display = 'none';
  feedbackEl.textContent = '';
  feedbackEl.className = 'checkout-feedback';
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
</script>
</body>
</html>
