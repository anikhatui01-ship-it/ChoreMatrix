<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Set New Password — ChoreMatrix</title>
<meta name="description" content="Enter a new password for your ChoreMatrix account." />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="alternate icon" href="/favicon.ico" />
<script>
  (function() {
    try {
      var s = localStorage.getItem('chorematrix_theme') || 'system';
      var d = s === 'dark' || (s === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme-setting', s);
    } catch(e){}
  })();
</script>
<link rel="stylesheet" href="/src/styles/common.css" />
<style>
  .auth-wrap {
    max-width: 440px;
    margin: 40px auto;
    width: 100%;
  }
  .auth-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px;
    box-shadow: var(--shadow);
  }
</style>
</head>
<body>

<div id="globalNavbar"></div>

<main class="main-content">
  <div class="shell">
    <div class="auth-wrap">
      <div class="auth-card">
        <h1 style="font-size:24px; font-weight:800; margin:0 0 6px; color:var(--ink); text-align:center;">Set New Password</h1>
        <p style="font-size:13px; color:var(--muted); text-align:center; margin:0 0 24px;">
          Choose a secure new password for your ChoreMatrix account.
        </p>

        <div id="resetAlert" class="alert-box" style="display:none;" role="alert"></div>
        <div id="resetSuccess" class="notice-banner" style="display:none;"></div>

        <form id="newPassForm">
          <div class="field">
            <label for="txtNewPassword">New Password</label>
            <input type="password" id="txtNewPassword" required minlength="8" placeholder="At least 8 characters" />
          </div>

          <div class="field">
            <label for="txtConfirmNewPassword">Confirm New Password</label>
            <input type="password" id="txtConfirmNewPassword" required minlength="8" placeholder="Repeat your new password" />
          </div>

          <button type="submit" class="btn primary" id="btnUpdatePass" style="width:100%; margin-top:8px;">
            Update Password
          </button>
        </form>

        <div style="text-align:center; font-size:13px; color:var(--muted); margin-top:20px;">
          Back to <a href="/login.html" style="font-weight:700;">Sign in</a>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="globalFooter"></div>

<script type="module">
import { authService, renderNavbar, renderFooter, initCookieBanner } from './src/client.bundle.js';

renderNavbar('reset-password');
renderFooter();
initCookieBanner();

const form = document.getElementById('newPassForm');
const newPassInput = document.getElementById('txtNewPassword');
const confirmInput = document.getElementById('txtConfirmNewPassword');
const submitBtn = document.getElementById('btnUpdatePass');
const alertBox = document.getElementById('resetAlert');
const successBox = document.getElementById('resetSuccess');

form?.addEventListener('submit', async (e) => {
  e.preventDefault();
  alertBox.style.display = 'none';
  successBox.style.display = 'none';

  const newPass = newPassInput.value;
  const confirm = confirmInput.value;

  if (!newPass || newPass.length < 8) {
    alertBox.textContent = 'Password must be at least 8 characters long.';
    alertBox.style.display = 'block';
    return;
  }
  if (newPass !== confirm) {
    alertBox.textContent = 'Passwords do not match.';
    alertBox.style.display = 'block';
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Updating…';

  try {
    await authService.updatePassword(newPass);
    successBox.innerHTML = `
      <strong>Password Updated:</strong> Your password has been successfully changed. You can now <a href="/login.html" style="font-weight:700; color:var(--accent);">Sign in</a> with your new credentials.
    `;
    successBox.style.display = 'block';
    form.style.display = 'none';
  } catch (err) {
    alertBox.textContent = err.message || 'Unable to update password. Your reset link may have expired.';
    alertBox.style.display = 'block';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Update Password';
  }
});
</script>
</body>
</html>
